name: Build portable Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: efcfaaf60d7ec57a159fc3110403d939bfb69729
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure static portable build
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DUNIVERSAL_STITCHER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create portable folder
        shell: pwsh
        run: cmake --install build --config Release --prefix release-candidate

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release-candidate\* -DestinationPath UniversalScrollStitcher-windows-x64.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: UniversalScrollStitcher-windows-x64
          path: release-candidate/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isVersionTag = '${{ github.ref_type }}' -eq 'tag'
          $tagName = if ($isVersionTag) {
            '${{ github.ref_name }}'
          } else {
            'build-${{ github.run_number }}'
          }
          $title = if ($isVersionTag) {
            'Universal Scroll Stitcher ${{ github.ref_name }}'
          } else {
            'Universal Scroll Stitcher build #${{ github.run_number }}'
          }
          $arguments = @(
            'release', 'create', $tagName,
            'UniversalScrollStitcher-windows-x64.zip',
            '--title', $title,
            '--generate-notes'
          )
          if ($isVersionTag -and '${{ github.ref_name }}' -match '-') {
            $arguments += '--prerelease'
          } else {
            $arguments += '--latest'
          }
          if (-not $isVersionTag) {
            $arguments += @('--target', '${{ github.sha }}')
          }
          gh @arguments
