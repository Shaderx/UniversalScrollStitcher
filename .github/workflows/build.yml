name: Build portable Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: efcfaaf60d7ec57a159fc3110403d939bfb69729
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure static portable build
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DUNIVERSAL_STITCHER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create portable folder
        shell: pwsh
        run: cmake --install build --config Release --prefix release-candidate

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release-candidate\* -DestinationPath UniversalScrollStitcher-windows-x64.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalScrollStitcher-windows-x64
          path: release-candidate/
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            'UniversalScrollStitcher-windows-x64.zip',
            '--title', 'Universal Scroll Stitcher ${{ github.ref_name }}',
            '--generate-notes'
          )
          if ('${{ github.ref_name }}' -match '-') { $arguments += '--prerelease' }
          gh @arguments
